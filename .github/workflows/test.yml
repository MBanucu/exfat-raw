name: Run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq exfatprogs

      - name: Load exFAT kernel module (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo modprobe exfat 2>/dev/null && echo "Module loaded" || {
            echo "Trying to install kernel modules..."
            sudo apt-get install -y -qq linux-modules-extra-$(uname -r)
            sudo modprobe exfat
          }
          grep -w exfat /proc/filesystems

      - name: Check os.utime capability on exFAT
        id: utime_check
        continue-on-error: true
        run: python tests/check_utime.py

      - name: Report os.utime capability
        run: |
          if [ "${{ steps.utime_check.outcome }}" = "success" ]; then
            echo "os.utime WORKS on exFAT — all tests will run"
          else
            echo "os.utime DOES NOT WORK on exFAT — test_utime skipped"
          fi

      - name: Install coverage tool
        run: python -m pip install coverage

      - name: Run tests with coverage
        run: python -m coverage run -m unittest discover -s tests -v

      - name: Report coverage
        run: python -m coverage report --fail-under=80 --skip-covered

  coverage-report:
    name: Coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq exfatprogs

      - name: Load exFAT kernel module
        run: |
          sudo modprobe exfat 2>/dev/null && echo "Module loaded" || {
            sudo apt-get install -y -qq linux-modules-extra-$(uname -r)
            sudo modprobe exfat
          }
          grep -w exfat /proc/filesystems

      - name: Check os.utime capability on exFAT
        id: utime_check
        continue-on-error: true
        run: python tests/check_utime.py

      - name: Install coverage tool
        run: python -m pip install coverage

      - name: Run tests with coverage
        run: python -m coverage run -m unittest discover -s tests -v

      - name: Generate HTML coverage report
        run: python -m coverage html -d htmlcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
