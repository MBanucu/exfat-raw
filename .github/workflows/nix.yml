name: Nix build & test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Build
        run: nix build

      - name: Set up exFAT
        run: |
          sudo modprobe exfat 2>/dev/null || {
            sudo apt-get install -y -qq linux-modules-extra-$(uname -r)
            sudo modprobe exfat
          }
          grep -w exfat /proc/filesystems

      - name: Check os.utime capability
        id: utime_check
        continue-on-error: true
        run: nix develop -c python tests/check_utime.py

      - name: Report os.utime capability
        run: |
          if [ "${{ steps.utime_check.outcome }}" = "success" ]; then
            echo "os.utime WORKS on exFAT — all tests will run"
          else
            echo "os.utime DOES NOT WORK on exFAT — test_utime skipped"
          fi

      - name: Run tests
        run: nix develop -c python -m unittest discover -s tests -v
