name: Nix build & test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Build
        run: nix build

      - name: Run tests
        run: |
          nix develop -c bash -e -c '
            sudo modprobe exfat 2>/dev/null && echo "exFAT module loaded" || echo "exFAT module not available"
            grep -w exfat /proc/filesystems || true
            python tests/check_utime.py && echo "os.utime WORKS — all tests will run" || echo "os.utime DOES NOT WORK — test_utime skipped"
            python -m unittest discover -s tests -v
          '
